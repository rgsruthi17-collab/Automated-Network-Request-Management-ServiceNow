<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="600" viewBox="0 0 1200 600"><rect width="1200" height="600" fill="#f5f7fb"/><text x="600" y="50" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#17365d">Data Flow Diagram — Network Request</text><defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#2874a6"/></marker></defs><rect x="40" y="220" width="190" height="100" rx="15" fill="#eaf2f8" stroke="#2874a6" stroke-width="2"/><text x="135" y="260" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17365d">Requester</text><text x="135" y="289" text-anchor="middle" font-family="Arial" font-size="15" fill="#263746">Submits request</text><rect x="300" y="220" width="210" height="100" rx="15" fill="#eaf2f8" stroke="#2874a6" stroke-width="2"/><text x="405" y="260" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17365d">ServiceNow</text><text x="405" y="289" text-anchor="middle" font-family="Arial" font-size="15" fill="#263746">Validates & records</text><rect x="590" y="100" width="210" height="100" rx="15" fill="#eaf2f8" stroke="#2874a6" stroke-width="2"/><text x="695" y="140" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17365d">Approver</text><text x="695" y="169" text-anchor="middle" font-family="Arial" font-size="15" fill="#263746">Reviews request</text><rect x="590" y="350" width="210" height="100" rx="15" fill="#eaf2f8" stroke="#2874a6" stroke-width="2"/><text x="695" y="390" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17365d">Network Team</text><text x="695" y="419" text-anchor="middle" font-family="Arial" font-size="15" fill="#263746">Implements task</text><rect x="900" y="220" width="250" height="100" rx="15" fill="#eaf2f8" stroke="#2874a6" stroke-width="2"/><text x="1025" y="260" text-anchor="middle" font-family="Arial" font-size="21" font-weight="700" fill="#17365d">Request Status</text><text x="1025" y="289" text-anchor="middle" font-family="Arial" font-size="15" fill="#263746">Notify & close</text><path d="M230 270 H300" stroke="#2874a6" stroke-width="3" marker-end="url(#a)"/><path d="M510 245 L590 150" stroke="#2874a6" stroke-width="3" marker-end="url(#a)"/><path d="M510 295 L590 400" stroke="#2874a6" stroke-width="3" marker-end="url(#a)"/><path d="M800 150 L900 245" stroke="#2874a6" stroke-width="3" marker-end="url(#a)"/><path d="M800 400 L900 295" stroke="#2874a6" stroke-width="3" marker-end="url(#a)"/><text x="600" y="550" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">Conceptual flow; configure tables, approvals, notifications, and access controls in the ServiceNow instance.</text></svg>