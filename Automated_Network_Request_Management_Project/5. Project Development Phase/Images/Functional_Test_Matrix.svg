<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650"><rect width="1200" height="650" fill="#f5f7fb"/><text x="600" y="48" text-anchor="middle" font-family="Arial" font-size="31" font-weight="700" fill="#17365d">Functional &amp; Performance Test Matrix</text><text x="600" y="80" text-anchor="middle" font-family="Arial" font-size="16" fill="#526579">Template — populate Result and Evidence after executing tests in the instance</text><rect x="45" y="115" width="1110" height="52" fill="#17365d" rx="8"/><g font-family="Arial" font-size="17" font-weight="700" fill="#fff"><text x="65" y="147">ID</text><text x="145" y="147">Test scenario</text><text x="555" y="147">Expected result</text><text x="890" y="147">Result / evidence</text></g><rect x="45" y="167" width="1110" height="67" fill="#fff" stroke="#c5d3e0"/><g font-family="Arial" font-size="16" fill="#17365d"><text x="65" y="207">TC-01</text><text x="145" y="207">Submit valid request</text><text x="555" y="207">Request record is created</text><text x="890" y="207">Pending execution</text></g><rect x="45" y="234" width="1110" height="67" fill="#eaf1f8" stroke="#c5d3e0"/><g font-family="Arial" font-size="16" fill="#17365d"><text x="65" y="274">TC-02</text><text x="145" y="274">Required field missing</text><text x="555" y="274">Validation prevents submission</text><text x="890" y="274">Pending execution</text></g><rect x="45" y="301" width="1110" height="67" fill="#fff" stroke="#c5d3e0"/><g font-family="Arial" font-size="16" fill="#17365d"><text x="65" y="341">TC-03</text><text x="145" y="341">Approval accepted</text><text x="555" y="341">Request moves to approved state</text><text x="890" y="341">Pending execution</text></g><rect x="45" y="368" width="1110" height="67" fill="#eaf1f8" stroke="#c5d3e0"/><g font-family="Arial" font-size="16" fill="#17365d"><text x="65" y="408">TC-04</text><text x="145" y="408">Approval rejected</text><text x="555" y="408">Rejection state and notice are recorded</text><text x="890" y="408">Pending execution</text></g><rect x="45" y="435" width="1110" height="67" fill="#fff" stroke="#c5d3e0"/><g font-family="Arial" font-size="16" fill="#17365d"><text x="65" y="475">TC-05</text><text x="145" y="475">Assignment and closure</text><text x="555" y="475">Task reaches correct group and status</text><text x="890" y="475">Pending execution</text></g><rect x="45" y="502" width="1110" height="67" fill="#eaf1f8" stroke="#c5d3e0"/><g font-family="Arial" font-size="16" fill="#17365d"><text x="65" y="542">TC-06</text><text x="145" y="542">Unauthorized access</text><text x="555" y="542">Restricted actions are blocked</text><text x="890" y="542">Pending execution</text></g></svg>