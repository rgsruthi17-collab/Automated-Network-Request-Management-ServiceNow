<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820"><rect width="1200" height="820" fill="#f5f7fb"/><text x="600" y="55" text-anchor="middle" font-family="Arial" font-size="32" font-weight="700" fill="#17365d">Empathy Map Canvas — Network Requester</text><text x="600" y="88" text-anchor="middle" font-family="Arial" font-size="17" fill="#526579">User needs and pain points for the ServiceNow request experience</text><rect x="60" y="130" width="525" height="265" rx="18" fill="#eaf2f8" stroke="#8ba9c4" stroke-width="2"/><rect x="60" y="130" width="525" height="58" rx="18" fill="#2874a6"/><text x="85" y="167" font-family="Arial" font-size="22" font-weight="700" fill="#fff">SAYS</text><circle cx="98" cy="241" r="6" fill="#2874a6"/><text x="120" y="248" font-family="Arial" font-size="20" fill="#17365d">“I don’t know who is handling my request.”</text><circle cx="98" cy="294" r="6" fill="#2874a6"/><text x="120" y="301" font-family="Arial" font-size="20" fill="#17365d">“I need access quickly.”</text><rect x="615" y="130" width="525" height="265" rx="18" fill="#eaf2f8" stroke="#8ba9c4" stroke-width="2"/><rect x="615" y="130" width="525" height="58" rx="18" fill="#2874a6"/><text x="640" y="167" font-family="Arial" font-size="22" font-weight="700" fill="#fff">THINKS</text><circle cx="653" cy="241" r="6" fill="#2874a6"/><text x="675" y="248" font-family="Arial" font-size="20" fill="#17365d">Is my request approved?</text><circle cx="653" cy="294" r="6" fill="#2874a6"/><text x="675" y="301" font-family="Arial" font-size="20" fill="#17365d">What information should I provide?</text><rect x="60" y="440" width="525" height="265" rx="18" fill="#eaf2f8" stroke="#8ba9c4" stroke-width="2"/><rect x="60" y="440" width="525" height="58" rx="18" fill="#2874a6"/><text x="85" y="477" font-family="Arial" font-size="22" font-weight="700" fill="#fff">DOES</text><circle cx="98" cy="551" r="6" fill="#2874a6"/><text x="120" y="558" font-family="Arial" font-size="20" fill="#17365d">Contacts support repeatedly</text><circle cx="98" cy="604" r="6" fill="#2874a6"/><text x="120" y="611" font-family="Arial" font-size="20" fill="#17365d">Shares details through email or chat</text><rect x="615" y="440" width="525" height="265" rx="18" fill="#eaf2f8" stroke="#8ba9c4" stroke-width="2"/><rect x="615" y="440" width="525" height="58" rx="18" fill="#2874a6"/><text x="640" y="477" font-family="Arial" font-size="22" font-weight="700" fill="#fff">FEELS</text><circle cx="653" cy="551" r="6" fill="#2874a6"/><text x="675" y="558" font-family="Arial" font-size="20" fill="#17365d">Frustrated by delays</text><circle cx="653" cy="604" r="6" fill="#2874a6"/><text x="675" y="611" font-family="Arial" font-size="20" fill="#17365d">Uncertain without status updates</text><rect x="60" y="730" width="1080" height="55" rx="12" fill="#17365d"/><text x="600" y="764" text-anchor="middle" font-family="Arial" font-size="19" font-weight="700" fill="#fff">Opportunity: simple forms • transparent approvals • live status • clear notifications</text></svg>